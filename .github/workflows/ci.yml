name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  iac:
    name: IaC: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
      - name: fmt -check
        run: tofu fmt -check -recursive iac
      - name: validate (environments/dev)
        working-directory: iac/environments/dev
        run: |
          tofu init -backend=false -input=false
          tofu validate

  tool:
    name: net-drift-check: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: tools/net-drift-check
        run: python -m pip install -r requirements.txt
      - name: Run tests
        working-directory: tools/net-drift-check
        run: python -m pytest -q
