name: ci

on:
  push:
    branches: [main]

jobs:
  iac:
    name: "IaC: fmt + validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8
      - name: fmt -check
        run: tofu fmt -check -recursive iac
      - name: validate (environments/dev)
        working-directory: iac/environments/dev
        run: |
          tofu init -backend=false -input=false
          tofu validate

  tool:
    name: "net-drift-check: pytest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: tools/net-drift-check
        run: python -m pip install -r requirements.txt
      - name: Run tests
        working-directory: tools/net-drift-check
        run: python -m pytest -q
